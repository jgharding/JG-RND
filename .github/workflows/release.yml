# Desktop apps: pushing a version tag (e.g. git tag v1.1.0 && git push origin v1.1.0) builds
# Windows (.exe installer), macOS (.dmg, Intel + Apple Silicon) and Linux (.AppImage, .deb)
# and attaches them to a GitHub Release for that tag. The app version is taken from the tag.
#
# Each OS only builds and hands its installers on as a workflow artifact; one final job then
# attaches them all to the release. (Letting all three builds publish to the same new release
# at once made the Windows upload fail.)
name: Release desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: macos-latest
            platform: --mac
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run build
      - name: Build installers
        run: npx electron-builder ${{ matrix.platform }} --publish never
        env:
          # Unsigned builds (no Apple / Windows code-signing certificates)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: JG-RND-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb

  release:
    # Manual runs (no tag) stop at the workflow artifacts above
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: JG-RND ${{ github.ref_name }}
          files: installers/*
